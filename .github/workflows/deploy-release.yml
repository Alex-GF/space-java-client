name: Publish package to the Maven Central Repository
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing validated release tag to publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - name: Set up Maven Central Repository
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          server-id: central
          server-username: CENTRAL_PORTAL_USERNAME
          server-password: CENTRAL_PORTAL_PASSWORD
          gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Configure GPG
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
      - name: Import GPG keys
        run: |
          echo "${{ secrets.OSSRH_GPG_SECRET_KEY }}" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG
      
      - name: Set up Maven 3.9.9 for Central plugin compatibility
        env:
          MAVEN_VERSION: '3.9.9'
        run: |
          set -Eeuo pipefail
          trap 'echo "Maven setup failed on line $LINENO" >&2' ERR
          archive="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          install_dir="${RUNNER_TEMP}/sdk-maven"
          base_url="https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error "${base_url}/${archive}" --output "${install_dir}/${archive}"
          curl --fail --location --silent --show-error "${base_url}/${archive}.sha512" --output "${install_dir}/${archive}.sha512"
          checksum="$(tr -d '[:space:]' < "${install_dir}/${archive}.sha512")"
          [[ "$checksum" =~ ^[a-fA-F0-9]{128}$ ]] || { echo "Invalid Maven SHA-512" >&2; exit 1; }
          printf '%s  %s\n' "$checksum" "${install_dir}/${archive}" | sha512sum --check
          tar -xzf "${install_dir}/${archive}" -C "$install_dir"
          echo "${install_dir}/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Verify Maven version
        run: mvn --version
      - name: Run test
        run: mvn test
      - name: Publish to Central Repository
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
        run: mvn -Prelease deploy
